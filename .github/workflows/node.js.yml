name: Node.js CI/CD

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - run: npm install

    # Bước 2: Tạo file .env từ GitHub Secret
    - name: Create .env file
      run: |
        echo "${{ secrets.ENV_FILE }}" > .env

    # Bước 3: Khởi động lại app bằng PM2 (Sử dụng reload để tránh gián đoạn)
    - name: Restart app with PM2
      run: |
        pm2 reload all || pm2 start server.js --name "shopdev-api"